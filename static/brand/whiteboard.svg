<svg xmlns="http://www.w3.org/2000/svg" width="320" height="96" viewBox="0 0 320 96" role="img" aria-label="Whiteboard">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6fa"/>
    </linearGradient>
  </defs>
  <!-- tray / frame -->
  <rect x="8" y="10" width="304" height="76" rx="8" fill="#5b2d8e"/>
  <!-- whiteboard surface -->
  <rect x="16" y="16" width="288" height="56" rx="4" fill="url(#g)" stroke="#d7dbe3" stroke-width="1.5"/>
  <!-- subtle ruled feel -->
  <line x1="36" y1="36" x2="160" y2="36" stroke="#e6e9ef" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="48" x2="210" y2="48" stroke="#e6e9ef" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="60" x2="120" y2="60" stroke="#e6e9ef" stroke-width="2" stroke-linecap="round"/>
  <!-- marker accent -->
  <rect x="268" y="54" width="22" height="6" rx="2" fill="#7c3aed"/>
</svg>
