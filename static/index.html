<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="ocean">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>Agent Hub</title>
  <link rel="stylesheet" href="/style.css?v=4.0.0" />
</head>
<body>
  <div id="login-overlay" class="overlay hidden">
    <form id="login-form" class="login-card">
      <h1>Agent Hub</h1>
      <p data-i18n="login.hint">输入访问密码以连接终端</p>
      <input type="password" id="login-password" data-i18n-placeholder="login.password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" data-i18n="login.submit">进入</button>
      <p id="login-error" class="error hidden" data-i18n="login.error">密码错误</p>
    </form>
  </div>

  <div id="app" class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <img class="brand-logo" src="/brand/suat-logo-color.png?v=4.0.0" alt="SUAT" />
          <div>
            <div class="brand-name">Agent Hub</div>
          <div class="brand-sub" id="version-label">v4.0.0</div>
          </div>
        </div>
        <div class="quick-prefs">
          <button type="button" id="btn-lang" class="btn ghost chip" title="Language">中 / EN</button>
          <button type="button" id="btn-theme" class="btn ghost chip" title="Theme">☾ / ☀</button>
        </div>
        <div class="bg-row" id="bg-row" title="Background"></div>
        <div class="accent-row" id="accent-row" title="Accent color"></div>
        <div class="font-size-row" id="font-size-row" title="Font size">
          <span class="font-size-label" id="font-size-label" data-i18n="appearance.fontSize">字号</span>
          <button type="button" id="btn-font-dec" class="btn ghost chip font-step" aria-label="Decrease font size">A−</button>
          <select id="font-size-select" class="font-size-select" aria-label="Font size"></select>
          <button type="button" id="btn-font-inc" class="btn ghost chip font-step" aria-label="Increase font size">A+</button>
        </div>
        <button type="button" id="btn-new" class="btn primary" data-i18n="nav.newChat">+ 新任务</button>
      </div>

      <div id="panel-main" class="side-panel">
       <div class="side-section-label" data-i18n="nav.sessions">会话</div>
        <form id="folder-create-form" class="folder-tools"><input id="new-folder-name" class="input" placeholder="文件夹名称" aria-label="文件夹名称" /><button id="btn-new-folder" type="submit" class="btn ghost folder-add" title="新建文件夹">新建文件夹</button></form>
       <div id="session-list" class="session-list"></div>
      </div>

      <div class="sidebar-foot">
        <button id="btn-control" class="btn ghost block" data-i18n="nav.control">⚙ 控制中心</button>
        <div id="conn-info" class="conn-info"></div>
        <div id="agent-badge" class="badge">checking…</div>
      </div>
      <div
        id="sidebar-resize"
        class="sidebar-resize"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        title="拖拽调整侧栏宽度 · 双击恢复默认"
        tabindex="0"
      ></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="btn-menu" class="btn ghost icon" aria-label="Menu">☰</button>
        <h2 id="chat-title" data-i18n="chat.new">New chat</h2>
        <span id="route-badge" class="route-badge">AUTO</span>
        <span id="engine-badge" class="route-badge engine-badge hidden" title="Engine"></span>
        <span id="token-chip" class="token-chip hidden" title="Token usage · Click for details">
          <span id="token-in">0</span>↑ <span id="token-out">0</span>↓
          <span id="token-cost" class="muted"></span>
        </span>
        <button id="btn-subagent-popout" class="btn ghost hidden" title="在独立窗口查看子代理">⧉ 子窗口</button>
        <button id="btn-stop" class="btn ghost hidden" title="Stop">⏹</button>
      </header>
      <div id="subagent-bar" class="subagent-bar hidden" aria-label="Subagents" hidden></div>
      <div id="active-runs" class="active-runs hidden" aria-label="Active runs"></div>

      <div id="chat-panes" class="chat-panes">
        <div id="messages" class="messages">
          <div class="empty-state" id="empty-state">
          <img class="empty-logo-img" src="/brand/suat-logo-color.png?v=4.0.0" alt="深圳理工大学" />
            <h3 data-i18n="empty.title">校园 Agent Hub</h3>
            <p data-i18n-html="empty.body">描述任务并运行 · Agent Hub 调度 Skill / Agent · 进度条跟踪执行</p>
          </div>
        </div>
        <aside id="subagent-pane" class="subagent-pane hidden">
          <div class="subagent-pane-head">
            <strong id="subagent-pane-title">Subagent</strong>
            <button type="button" id="btn-close-subpane" class="btn ghost chip">×</button>
          </div>
          <div id="subagent-pane-body" class="subagent-pane-body muted"></div>
        </aside>
      </div>

      <footer class="composer">
        <div
          id="composer-resize"
          class="composer-resize"
          role="separator"
          aria-orientation="horizontal"
          aria-label="Resize composer"
          tabindex="0"
        ></div>
        <div id="stream-status" class="stream-status hidden" aria-live="polite">
          <div class="stream-status-head">
            <span class="stream-status-dot" aria-hidden="true"></span>
            <strong id="stream-status-label" data-i18n="stream.running">思考与输出中…</strong>
            <span id="stream-status-pct" class="muted">0%</span>
          </div>
          <div class="stream-status-track"><div id="stream-status-bar" class="stream-status-fill"></div></div>
          <div id="stream-status-hint" class="stream-status-hint muted"></div>
        </div>
        <div id="busy-bar" class="busy-bar hidden" aria-live="polite">
          <label class="busy-mode-field">
            <span data-i18n="busy.mode">忙碌时</span>
            <select id="busy-mode-select">
              <option value="queue" data-i18n="busy.queue">排队</option>
              <option value="steer" data-i18n="busy.steer">中途指引</option>
            </select>
          </label>
          <span id="busy-pending" class="busy-pending muted hidden"></span>
          <button type="button" id="btn-stop-send" class="btn ghost chip hidden" data-i18n="busy.stopSend">停止并发送排队</button>
        </div>
        <div class="composer-essentials">
          <button
            type="button"
            id="btn-composer-adv"
            class="btn ghost chip composer-adv-toggle"
            aria-expanded="false"
            aria-controls="composer-advanced"
            title="Skill / Soul / Route / Model"
          >
            <span class="composer-adv-chevron" aria-hidden="true">▸</span>
            <span data-i18n="composer.settings">任务设置</span>
            <span id="composer-adv-badge" class="composer-adv-badge hidden"></span>
          </button>
          <label class="composer-hub-compact" title="Agent vs Fast chat">
            <span class="sr-only" data-i18n="composer.hubChat">Hub 聊天</span>
            <select id="hub-chat-mode-select">
              <option value="agent" data-i18n="hubChat.agent">Agent（工具）</option>
              <option value="direct" data-i18n="hubChat.direct">快聊</option>
            </select>
          </label>
          <span id="composer-adv-summary" class="composer-adv-summary muted"></span>
        </div>
        <div id="composer-advanced" class="composer-advanced" hidden>
          <div id="skill-bar" class="skill-bar skill-bar-composer" aria-label="Skills">
            <div class="skill-bar-head">
              <span data-i18n="skills.picker">Skill</span>
              <select id="skill-cat-select" title="Category"></select>
              <select id="skill-sub-select" title="Subcategory"></select>
              <select id="skill-pick-select" class="skill-pick-select" title="Skill">
                <option value="">— 选择 Skill —</option>
              </select>
              <button type="button" class="btn ghost chip" id="btn-skill-add" data-i18n="skills.add">添加</button>
              <button type="button" class="btn ghost chip" id="btn-skill-auto" data-i18n="skills.auto">自动匹配</button>
            </div>
            <div id="skill-selected" class="skill-selected-row"></div>
          </div>
          <div id="auto-plan-strip" class="auto-plan-strip hidden" aria-live="polite"></div>
          <div class="composer-tools">
            <label>
              <span data-i18n="composer.model">优先模型</span>
              <select id="model-select"></select>
            </label>
            <label>
              <span data-i18n="composer.thinkingDepth">思考深度</span>
              <select id="thinking-depth-select">
                <option value="light" data-i18n="thinking.light">轻 / Light</option>
                <option value="medium" selected data-i18n="thinking.medium">中 / Medium</option>
                <option value="high" data-i18n="thinking.high">高 / High</option>
                <option value="very_high" data-i18n="thinking.veryHigh">非常高 / Very high</option>
              </select>
            </label>
            <label class="grow workspace-field">
              <span data-i18n="composer.workspace">工作区</span>
              <div class="workspace-row">
                <input id="workspace-input" type="text" data-i18n-placeholder="composer.workspacePh" placeholder="可选：工作目录路径" />
                <button type="button" id="btn-browse-ws" class="btn ghost" title="Browse">…</button>
              </div>
              <span id="auto-route-hint" class="auto-hint muted"></span>
              <div id="ws-grounding" class="ws-grounding muted"></div>
            </label>
          </div>
        </div>
        <div id="attach-bar" class="attach-bar hidden"></div>
        <div class="composer-row composer-row-ext">
          <div class="composer-actions">
            <button type="button" id="btn-upload-file" class="btn ghost chip" title="Upload file">📎</button>
            <button type="button" id="btn-upload-folder" class="btn ghost chip" title="Upload folder">📁</button>
            <button type="button" id="btn-web-search" class="btn ghost chip" data-i18n="composer.search" title="Deep web search">联网搜索</button>
            <button type="button" id="btn-deep-search" class="btn ghost chip active" data-i18n="composer.deepSearch" title="Deep multi-engine search">深度搜索</button>
            <input type="file" id="file-input" class="hidden" multiple accept="image/*,.xlsx,.xlsm,.xls,.csv,.tsv,.pdf,.doc,.docx,.txt,.md,.json,.zip,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
            <input type="file" id="folder-input" class="hidden" webkitdirectory directory multiple />
          </div>
          <textarea id="input" rows="1" data-i18n-placeholder="composer.inputPh" placeholder="描述办公/科研任务… Enter 换行 · ⌘/Ctrl+Enter 运行工作流"></textarea>
          <button id="btn-send" class="btn primary send" disabled data-i18n="composer.send">运行</button>
        </div>
      </footer>
    </main>
  </div>

  <div id="fs-overlay" class="overlay hidden">
    <div class="control-card fs-card">
      <div class="control-head">
        <h2 id="fs-title">选择工作路径</h2>
        <button type="button" id="btn-fs-close" class="btn ghost">关闭</button>
      </div>
      <div class="fs-toolbar">
        <button type="button" id="btn-fs-up" class="btn ghost">↑ 上级</button>
        <input id="fs-path" type="text" readonly />
        <button type="button" id="btn-fs-use" class="btn primary">使用此目录</button>
      </div>
      <div id="fs-shortcuts" class="fs-shortcuts"></div>
      <div id="fs-list" class="fs-list"></div>
    </div>
  </div>

  <div id="control-overlay" class="overlay hidden">
    <div class="control-card">
      <div class="control-head">
        <h2 data-i18n="control.title">控制中心</h2>
        <button id="btn-control-close" class="btn ghost" data-i18n="control.close">关闭</button>
      </div>
      <div class="control-tabs">
        <button class="ctab active" data-ctab="appearance" data-i18n="control.appearance">外观</button>
        <button class="ctab" data-ctab="health" data-i18n="control.health">健康</button>
        <button class="ctab" data-ctab="backend" data-i18n="control.backend">后端</button>
        <button class="ctab" data-ctab="search" data-i18n="control.search">搜索</button>
        <button class="ctab" data-ctab="models" data-i18n="control.models">模型</button>
        <button class="ctab" data-ctab="runtimes" data-i18n="control.runtimes">Claws</button>
        <button class="ctab" data-ctab="ecosystem" data-i18n="control.ecosystem">生态</button>
        <button class="ctab" data-ctab="mcp" data-i18n="control.mcp">MCP</button>
        <button class="ctab" data-ctab="skills" data-i18n="control.skills">Skills</button>
        <button class="ctab" data-ctab="recommend" data-i18n="control.recommend">每日推荐</button>
        <button class="ctab" data-ctab="soul" data-i18n="control.soul">Soul</button>
        <button class="ctab" data-ctab="agents" data-i18n="control.agents">Agents</button>
        <button class="ctab" data-ctab="feedback" data-i18n="control.feedback">反馈</button>
        <button class="ctab" data-ctab="obsidian" data-i18n="control.obsidian">知识库</button>
        <button class="ctab" data-ctab="schedule" data-i18n="control.schedule">定时任务</button>
        <button class="ctab" data-ctab="security" data-i18n="control.security">安全</button>
      </div>
      <div class="control-body">
        <section id="ctab-appearance" class="ctab-panel"></section>
        <section id="ctab-health" class="ctab-panel hidden"></section>
        <section id="ctab-backend" class="ctab-panel hidden"></section>
        <section id="ctab-search" class="ctab-panel hidden"></section>
        <section id="ctab-models" class="ctab-panel hidden"></section>
        <section id="ctab-runtimes" class="ctab-panel hidden"></section>
        <section id="ctab-ecosystem" class="ctab-panel hidden"></section>
        <section id="ctab-mcp" class="ctab-panel hidden"></section>
        <section id="ctab-skills" class="ctab-panel hidden"></section>
        <section id="ctab-recommend" class="ctab-panel hidden"></section>
        <section id="ctab-soul" class="ctab-panel hidden"></section>
        <section id="ctab-agents" class="ctab-panel hidden"></section>
        <section id="ctab-feedback" class="ctab-panel hidden"></section>
        <section id="ctab-obsidian" class="ctab-panel hidden"></section>
        <section id="ctab-schedule" class="ctab-panel hidden"></section>
        <section id="ctab-security" class="ctab-panel hidden"></section>
      </div>
      <div class="control-foot">
        <button id="btn-save-settings" class="btn primary" data-i18n="control.save">保存配置</button>
        <span id="settings-status" class="muted"></span>
      </div>
    </div>
  </div>

  <div id="wf-overlay" class="overlay hidden">
    <div class="login-card wf-card">
      <h2 id="wf-title">工作流</h2>
      <p id="wf-desc" class="muted"></p>
      <textarea id="wf-input" rows="6" data-i18n-placeholder="wf.inputPh" placeholder="粘贴会议笔记 / 邮件要点 / 文档内容…"></textarea>
      <div class="row">
        <label class="check"><input type="checkbox" id="wf-save-inbox" /> <span data-i18n="wf.saveInbox">完成后写入 Obsidian AI_Candidates（需确认）</span></label>
      </div>
      <div class="row gap">
        <button id="wf-cancel" class="btn ghost" data-i18n="wf.cancel">取消</button>
        <button id="wf-run" class="btn primary" data-i18n="wf.run">运行</button>
      </div>
    </div>
  </div>

  <div id="sidebar-backdrop" class="backdrop hidden"></div>
  <script src="/app.js?v=4.0.0"></script>
</body>
</html>
