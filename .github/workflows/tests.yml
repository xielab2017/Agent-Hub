name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        # PyYAML: Hermes config.yaml sync (TLS + MCP) is YAML-aware when available
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Byte-compile
        run: python -m compileall -q ali server.py
      - name: Run tests
        env:
          HERMES_ALI_STATE_DIR: ${{ runner.temp }}/ali-state
          AGENT_CLI_HOME: ${{ runner.temp }}/agent-cli
          HERMES_HOME: ${{ runner.temp }}/hermes
        run: python -m pytest tests -q
