name: Review pipeline (THBS4)

# Runs scripts/review_pipeline.py — Agent Hub writes an evidence-grounded review
# with the configured MiniMax model (PubMed search → screening → drafting →
# three reviewer subagents → revision → Word).  The key comes only from the
# repository secret MINIMAX_KEY.  Outputs are uploaded as an artifact and
# committed back to the branch under outputs/thbs4_review/.
#
# Triggers: manual, or a push whose commit message contains "[review-thbs4]".

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[review-thbs4]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip pyyaml python-docx
      - name: Write the review
        env:
          MINIMAX_KEY: ${{ secrets.MINIMAX_KEY }}
        run: |
          if [ -z "$MINIMAX_KEY" ]; then echo "::error::Repository secret MINIMAX_KEY is not set."; exit 1; fi
          set -o pipefail
          python scripts/review_pipeline.py --out outputs/thbs4_review 2>&1 | tee review-log.txt
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thbs4-review
          path: |
            outputs/thbs4_review/
            review-log.txt
          if-no-files-found: ignore
      - name: Commit outputs
        if: always()
        run: |
          [ -d outputs/thbs4_review ] || exit 0
          cp review-log.txt outputs/thbs4_review/run-log.txt 2>/dev/null || true
          git config user.name "agent-hub-bot"
          git config user.email "agent-hub-bot@users.noreply.github.com"
          git add outputs/thbs4_review
          git diff --cached --quiet && exit 0
          git commit -m "THBS4 review outputs (run ${{ github.run_id }})"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break; sleep 5; done
