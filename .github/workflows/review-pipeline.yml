name: Review pipeline (THBS4)

# Runs scripts/review_pipeline.py — Agent Hub writes an evidence-grounded review
# with the configured MiniMax model (PubMed search → screening → drafting →
# three reviewer subagents → revision → Word).  The key comes only from the
# repository secret MINIMAX_KEY.  Outputs are uploaded as an artifact and
# committed back to the branch under outputs/thbs4_review/.
#
# Triggers (tags in the commit SUBJECT line):
#   [review-smoke]  fast check of every stage (few papers, 2 sections) → outputs/thbs4_smoke/
#   [review-thbs4]  the full review                                    → outputs/thbs4_review/
#   add [review-fresh] to ignore saved checkpoints; otherwise a re-run resumes at the stage that failed
#   (checkpoints are committed back with the outputs).

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[review-thbs4]') || contains(github.event.head_commit.message, '[review-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # one run at a time per branch: parallel runs would race when committing their outputs back
    concurrency:
      group: review-pipeline-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Mode
        # tags count only in the commit subject (a body may mention them in passing)
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf '%s\n' "$MSG" | head -n 1)
          RUN=false; SMOKE=false; FRESH=false
          case "$SUBJECT" in *"[review-thbs4]"*) RUN=true;; esac
          case "$SUBJECT" in *"[review-smoke]"*) RUN=true; SMOKE=true;; esac
          case "$SUBJECT" in *"[review-thbs4]"*) SMOKE=false;; esac
          case "$SUBJECT" in *"[review-fresh]"*) FRESH=true;; esac
          [ "${{ github.event_name }}" = workflow_dispatch ] && RUN=true
          echo "RUN=$RUN SMOKE=$SMOKE FRESH=$FRESH  ($SUBJECT)"
          { echo "RUN=$RUN"; echo "SMOKE=$SMOKE"; echo "FRESH=$FRESH"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - uses: actions/setup-python@v5
        if: env.RUN == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: env.RUN == 'true'
        run: python -m pip install --upgrade pip pyyaml python-docx
      - name: Write the review
        if: env.RUN == 'true'
        env:
          MINIMAX_KEY: ${{ secrets.MINIMAX_KEY }}
        run: |
          if [ -z "$MINIMAX_KEY" ]; then echo "::error::Repository secret MINIMAX_KEY is not set."; exit 1; fi
          set -o pipefail
          if [ "$SMOKE" = "true" ]; then OUT=outputs/thbs4_smoke; ARGS=--smoke; else OUT=outputs/thbs4_review; ARGS=; fi
          [ "$FRESH" = "true" ] && ARGS="$ARGS --fresh"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          python scripts/review_pipeline.py --out "$OUT" $ARGS 2>&1 | tee review-log.txt
      - name: Upload
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thbs4-review
          path: |
            outputs/
            review-log.txt
          if-no-files-found: ignore
      - name: Commit outputs
        if: always() && env.RUN == 'true'
        run: |
          OUT=${OUT:-outputs/thbs4_review}
          [ -d "$OUT" ] || exit 0
          cp review-log.txt "$OUT/run-log.txt" 2>/dev/null || true
          git config user.name "agent-hub-bot"
          git config user.email "agent-hub-bot@users.noreply.github.com"
          git add "$OUT"
          git diff --cached --quiet && exit 0
          git commit -m "Review outputs: $OUT (run ${{ github.run_id }})"
          # on a conflict in the output files this run's version wins (-X theirs = the commit being replayed)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::could not push the outputs"; exit 1
