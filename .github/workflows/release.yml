name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build source archives
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          STAGE="Hermes-ALI-${TAG#v}"
          mkdir -p dist "$STAGE"
          rsync -a --exclude '.git' --exclude 'dist' --exclude '.github' ./ "$STAGE/"
          tar -czf "dist/Hermes-ALI-${TAG#v}-src.tar.gz" "$STAGE"
          (cd "$STAGE" && zip -r "../dist/Hermes-ALI-${TAG#v}-src.zip" .)
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Hermes-ALI ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
          body: |
            ## Hermes-ALI ${{ steps.tag.outputs.name }}

            Lightweight cross-platform Hermes terminal with LAN/IP multi-device access.

            ### Quick start
            ```bash
            tar -xzf Hermes-ALI-*-src.tar.gz
            cd Hermes-ALI-*
            ./start.sh          # macOS / Linux
            # .\start.ps1       # Windows PowerShell
            ```

            Open `http://<server-ip>:8765` from phone or another computer.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
