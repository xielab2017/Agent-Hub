# Systematic, critical review of multi-omics analysis software, featuring EasyMultiProfiler.
topic: >-
  Software for multi-omics data integration and analysis: a systematic and critical comparison of frameworks,
  packages, workflows and platforms, with EasyMultiProfiler as a featured workflow for microbiome research
plan: false
featured:
  pmid: "40932530"
  name: EasyMultiProfiler (EMP)
  emphasis: >-
    the authors' R workflow for multi-omics integration in microbiome research (Sci China Life Sci 2025), built on
    SummarizedExperiment / MultiAssayExperiment with extraction, preparation, support, analysis and visualisation
    modules in a natural-language-style pipeline
coi_statement: >-
  The authors of this review developed EasyMultiProfiler (Liu B et al., Sci China Life Sci 2025). It is assessed
  with the same criteria as every other tool, and each statement about it is referenced to its published
  description.
seed_pmids: ["40932530"]
seed_queries:
  - multi-omics integration software
  - multi-omics data integration R package
  - microbiome multi-omics integration analysis
  - MultiAssayExperiment Bioconductor
  - mixOmics DIABLO integration
  - MOFA multi-omics factor analysis
  - MicrobiomeAnalyst
  - MetaboAnalyst multi-omics
  - multi-omics integration methods benchmark
  - multi-omics workflow reproducibility
  - host microbiome metabolome integration
  - QIIME 2 reproducible microbiome data science
  - deep learning multi-omics integration
  - multi-omics network analysis tool
  - SummarizedExperiment omics data structure
  - tidy microbiome analysis R package
focus_terms: [multi-omics, multiomics, omics integration, integrative analysis, data integration, software, R package,
              Bioconductor, workflow, pipeline, toolkit, web server, platform, EasyMultiProfiler]
context_terms: [multi-omics, integration, review, benchmark, software]
query_guidance: >-
  integration frameworks (matrix factorisation, multivariate, network, Bayesian, deep learning), R/Bioconductor
  packages and data structures, microbiome-centred workflows, web servers and point-and-click platforms,
  benchmarking and comparison studies, reproducibility and workflow standardisation, visualisation, applications
  in host–microbiome research
screen_rubric: >-
  relevance 3 = describes, benchmarks or directly compares a multi-omics analysis or integration software tool,
  package, workflow or platform; 2 = a single-omics analysis tool routinely used inside multi-omics workflows, or a
  methods paper on integration strategies; 1 = context only (reviews of the field, applications); 0 = irrelevant
screen_sections: [frameworks, microbiome_tools, statistics_ml, networks, platforms_web, workflows_reproducibility,
                  benchmarks, applications, other]
outline_guidance: >-
  Introduction (why multi-omics integration needs dedicated software); a taxonomy of integration strategies (early /
  intermediate / late, unsupervised / supervised); general-purpose integration frameworks; microbiome-centred
  multi-omics tools; web servers and point-and-click platforms; data structures, workflow systems and
  reproducibility; benchmarking evidence and evaluation criteria; EasyMultiProfiler — design, strengths and
  limitations relative to the alternatives; a dedicated 'Critical perspectives and controversies' section;
  recommendations for users and developers and a roadmap; conclusions
reviewers:
  - id: reviewer-bioinformatics-methods
    label: Reviewer 1 — bioinformatics methods & software engineering
    role: research
    desc: >-
      Peer reviewer, computational biologist who develops omics software. Judge the technical accuracy of how each
      tool and integration method is described, the evaluation criteria (scalability, data structures,
      interoperability, documentation, maintenance, reproducibility), and missing key tools.
  - id: reviewer-microbiome-user
    label: Reviewer 2 — microbiome & host–microbe biology (end user)
    role: research
    desc: >-
      Peer reviewer, microbiome and host-physiology scientist who uses these tools. Judge practical usability,
      suitability for real study designs (sample coverage, heterogeneous formats), biological interpretability and
      whether recommendations are actionable.
  - id: reviewer-editor-integrity
    label: Reviewer 3 — editor, citation integrity & balance
    role: research
    desc: >-
      Handling editor. Check that every citation supports its sentence (against the evidence cards), that the
      comparison is balanced and uses the same criteria for every tool, that the featured workflow is not
      over-promoted, structure, clarity and English.
table:
  title: Table 1. Multi-omics analysis software compared
  select: the most important software tools, packages, workflows or platforms (one row per tool)
  primary_only: false
  columns:
    - {key: tool, label: Tool (type), hint: "tool name and type, e.g. 'mixOmics (R package)'"}
    - {key: strengths, label: Strengths, hint: main strengths (<=20 words)}
    - {key: limitations, label: Limitations, hint: main limitations (<=20 words)}
